<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca - Gerenciador</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <div class="topbar"><a href="home.html" class="home-link">← Home</a></div>
    <h1>Gerenciador da Biblioteca</h1>
    <p class="intro">Painel para gerenciar registros: editar nome/hora ou excluir entradas.</p>

    <section class="card">
      <h2>Gerenciar livros</h2>
      <form id="addBookForm" style="display:flex; gap:0.5rem; margin-bottom:1rem; align-items:center;">
        <input id="bookCode" placeholder="Código (opcional)" style="padding:0.6rem; border-radius:8px; border:1px solid rgba(255,255,255,0.04);" />
        <input id="bookTitle" placeholder="Título" required style="flex:1; padding:0.6rem; border-radius:8px; border:1px solid rgba(255,255,255,0.04);" />
        <input id="bookAuthor" placeholder="Autor" style="padding:0.6rem; border-radius:8px; border:1px solid rgba(255,255,255,0.04); width:220px;" />
        <input id="bookCopies" type="number" min="1" placeholder="Cópias" style="width:80px; padding:0.6rem; border-radius:8px; border:1px solid rgba(255,255,255,0.04);" />
        <button type="submit">Adicionar livro</button>
      </form>

      <div class="table-header">
        <input id="searchInput" placeholder="Pesquisar por ID ou nome" style="flex:1; padding:0.7rem; border-radius:12px; border:1px solid #e6eefc;" />
        <button id="refreshButton">Atualizar</button>
      </div>
      <div id="managerList" class="table-container">Carregando...</div>
      <h3 style="margin-top:1rem">Livros cadastrados</h3>
      <div id="booksList" class="table-container">Carregando...</div>
    </section>
  </main>

  <script src="library_manager.js"></script>
</body>
</html>
